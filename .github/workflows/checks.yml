name: Verifica progetto
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verifica JavaScript
        run: |
          node --check public/app.js
          node --check public/shopping.js
          node --check src/shopping.mjs
          node --check src/worker.mjs
      - name: Test backend e autorizzazioni
        run: npm test
